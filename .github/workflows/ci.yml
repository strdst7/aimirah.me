name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  verify:
    name: build (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site:
          - clone-reframed-online-website
          - aimirah-mixtape
          - clone-string-tune-website
          - kdmirah-studio
          - pasarapi-mini-bounty-announcement
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Single install at the workspace root; every site shares one lockfile.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace ${{ matrix.site }}

      - name: Build
        run: npm run build --workspace ${{ matrix.site }} -- --configLoader runner

      - name: Check build output exists
        run: test -f ${{ matrix.site }}/dist/index.html
